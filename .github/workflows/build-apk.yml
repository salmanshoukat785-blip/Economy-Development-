name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project (unzip the newest ZIP if one was uploaded)
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT=.
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | while read -r z; do echo "$(git log -1 --format=%ct -- "$z") $z"; done | sort -n | tail -n 1 | cut -d' ' -f2-)
            if [ -z "$ZIP" ]; then echo "No ZIP or Gradle project found in the repository"; exit 1; fi
            echo "Using ZIP: $ZIP"
            rm -rf _proj && mkdir _proj
            unzip -q "$ZIP" -d _proj
            SETTINGS=$(find _proj -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
            if [ -z "$SETTINGS" ]; then echo "No Gradle project inside the ZIP"; exit 1; fi
            PROJECT=$(dirname "$SETTINGS")
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Kotlin files in project:"
          find "$PROJECT" -name '*.kt' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          cd "$PROJECT"
          if [ -x ./gradlew ]; then CMD=./gradlew; else CMD=gradle; fi
          $CMD assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | sed 's#file://##' | head -30 | while read -r line; do echo "::error::$line"; done || true
          {
            echo "### Compile errors (lines starting with e:)"
            echo '```'
            grep -E "^e: " build.log | sed 's#file://##' | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find "$PROJECT" -name '*-debug.apk' | head -n 1)
          cp "$APK" out/PMS-Economy-Notes.apk
          ls -la out

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMS-Economy-Notes-APK
          path: out/PMS-Economy-Notes.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: out/PMS-Economy-Notes.apk
